name: mix hex.audit
description: "Runs `mix hex.audit`"
inputs:
  working-directory:
    description: "Change the working directory that the commands are run within"
    required: false
    default: "${{ github.workspace }}"
  sarif:
    description: "Upload the audit result to GitHub code scanning as SARIF. Code scanning needs GitHub Advanced Security on private repositories. Disable this on private repositories without a paid GitHub plan. Requires OTP 27 or later and the `security-events: write` permission."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - id: audit
      run: |
        if [ "$SARIF" = "true" ]; then
          mix hex.audit --format sarif --output "$RUNNER_TEMP/hex-audit.sarif"
        else
          mix hex.audit
        fi
      shell: bash
      env:
        SARIF: ${{ inputs.sarif }}
        HEX_HOME: ${{ runner.temp }}/.hex
        MIX_HOME: ${{ runner.temp }}/.mix
      working-directory: "${{ inputs.working-directory }}"
    - if: ${{ always() && inputs.sarif == 'true' && steps.audit.outcome != 'skipped' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ runner.temp }}/hex-audit.sarif
        category: hex-audit
